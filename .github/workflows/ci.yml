name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest

    container:
      image: duyler/php-zts:latest
      options: --user root

    strategy:
      matrix:
        php-image: ['duyler/php-zts:latest']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "=== PHP Version ==="
          php -v
          echo ""
          echo "=== PHP Extensions ==="
          php -m | grep parallel && echo "✓ parallel extension found" || echo "✗ parallel extension NOT found"
          echo ""
          echo "=== Composer ==="
          composer --version
          echo ""
          echo "=== Working Directory ==="
          pwd
          echo ""
          echo "=== Repository Files ==="
          ls -la
          echo ""
          echo "=== PHPUnit Config ==="
          if [ -f phpunit.xml ]; then
            echo "✓ phpunit.xml found"
          else
            echo "✗ phpunit.xml NOT found"
          fi

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --colors=always

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --diff -v

      - name: Run Psalm
        run: vendor/bin/psalm --no-cache
